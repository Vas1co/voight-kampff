<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020506">
  <meta name="color-scheme" content="dark">
  <title>Voight-Kampff · Blade Runner'dan esinlenen empati testi</title>
  <meta name="description" content="Voight-Kampff: Blade Runner'dan esinlenen, tarayıcıda oynanan sinematik bir empati testi. Yedi soru; göz bebeğin, kızarman, nabzın ve tepki süren ölçülür. Makine hüküm vermez, kararı karşındaki verir.">
  <meta name="keywords" content="Voight-Kampff, Voight-Kampff testi, Blade Runner, empati testi, replikant, tarayıcı oyunu, fan oyunu">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Voight-Kampff">
  <meta property="og:title" content="Voight-Kampff · Blade Runner'dan esinlenen empati testi">
  <meta property="og:description" content="Sorgu odasındasın. Yedi soru, bir makine ve kararı veren biri. Blade Runner'dan esinlenen bir fan projesi.">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Voight-Kampff · Blade Runner'dan esinlenen empati testi">
  <meta name="twitter:description" content="Sorgu odasındasın. Yedi soru, bir makine ve kararı veren biri. Blade Runner'dan esinlenen bir fan projesi.">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- seçenekler görünürken alttaki karartma -->
  <div id="shade" aria-hidden="true"></div>

  <!-- sinema bantları ve kararma -->
  <div id="bars" aria-hidden="true"><i class="bar top"></i><i class="bar bottom"></i></div>
  <div id="fade" aria-hidden="true"></div>

  <!-- üst bilgi -->
  <header id="hud" hidden>
    <div class="hud-left">
      <span class="rec-dot" aria-hidden="true"></span>
      <span id="hud-rec"></span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="hud-subject"></span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="hud-counter" aria-live="polite"></span>
      <span class="sep tc-sep" aria-hidden="true">·</span>
      <span id="hud-tc" class="tc" aria-hidden="true">00:00:00:00</span>
    </div>
    <div class="hud-right">
      <button id="btn-sound" type="button" class="hud-btn"></button>
      <button id="btn-settings" type="button" class="hud-btn"></button>
    </div>
  </header>

  <!-- cevap seçenekleri ve süre -->
  <div id="answer">
    <div id="choices" role="group"></div>
    <div id="timer" aria-hidden="true"><i></i></div>
  </div>

  <!-- altyazılar -->
  <div id="subtitles" aria-live="polite" aria-atomic="true">
    <p id="sub-speaker"></p>
    <p id="sub-line"></p>
  </div>

  <!-- sonuç raporu -->
  <div id="result" role="dialog" aria-labelledby="result-title" hidden></div>

  <!-- sahne başlıkları -->
  <div id="titlecard" aria-live="polite"></div>

  <!-- giriş ekranı -->
  <div id="gate"></div>

  <!-- ayarlar -->
  <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
